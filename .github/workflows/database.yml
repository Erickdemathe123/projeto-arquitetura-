name: Banco MySQL (T07)
on:
  pull_request:
    paths: ['database/**', 'test/fixtures/**', '.github/workflows/database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sgp_ci_test_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psgp_ci_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node database/test-schema.cjs
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: sgp_ci_test_only
